<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi - FestivalHUB</title>
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/navbar :: nav}"></div>

    <div class="container-login">
        <div class="form-card">
            <div class="text-center mb-25">
                <div class="card-icon-lg">🎬</div>
                <h1 class="card-title mt-5">Accedi a FestivalHUB</h1>
                <p class="card-desc-text mt-5 mb-0">Inserisci le tue credenziali di accesso</p>
            </div>

            <!-- Avviso Registrazione con successo -->
            <div th:if="${param.registered}" class="alert-success">
                ✓ Registrazione completata! Effettua il login.
            </div>

            <!-- Errore Login -->
            <div th:if="${param.error}" class="alert-error">
                ⚠️ Username o password non validi. Riprova.
            </div>

            <form th:action="@{/login}" method="POST">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" placeholder="Inserisci il tuo username" required />
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required />
                </div>

                <button type="submit" class="btn-primary btn-full-width">Accedi</button>
            </form>

            <div class="form-footer">
                Non hai ancora un account? <a th:href="@{/register}">Registrati ora</a>
            </div>
        </div>
    </div>

</body>
</html>
