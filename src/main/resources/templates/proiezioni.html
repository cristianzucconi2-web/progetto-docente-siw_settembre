<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programma Proiezioni - FestivalHUB</title>
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/navbar :: nav}"></div>

    <div class="container">
        <div class="page-header-lg">
            <div>
                <h1 class="page-title">Calendario Completo Proiezioni</h1>
                <p class="page-subtitle">Tutte le proiezioni programmate nei diversi festival e sale.</p>
            </div>
            <div sec:authorize="hasAuthority('ADMIN')">
                <a th:href="@{/admin/nuovaProiezione}" class="btn-primary">+ Programma Proiezione</a>
            </div>
        </div>

        <table th:if="${not #lists.isEmpty(proiezioni)}" class="custom-table">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Ora</th>
                    <th>Film</th>
                    <th>Festival</th>
                    <th>Sala</th>
                    <th>Stato</th>
                    <th sec:authorize="hasAuthority('ADMIN')">Azioni</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${proiezioni}">
                    <td><strong th:text="${p.data}"></strong></td>
                    <td th:text="${p.ora}"></td>
                    <td>
                        <a th:href="@{/film/{id}(id=${p.film.id})}" th:text="${p.film.titolo}" class="link-table-title"></a>
                    </td>
                    <td>
                        <a th:href="@{/festival/{id}(id=${p.festival.id})}" th:text="${p.festival.nome}"></a>
                    </td>
                    <td th:text="${p.sala.nome}"></td>
                    <td>
                        <span th:class="${p.stato.name() == 'SCHEDULED' ? 'badge badge-green' : (p.stato.name() == 'CANCELLED' ? 'badge badge-red' : 'badge')}"
                              th:text="${p.stato.etichetta}">
                        </span>
                    </td>
                    <td sec:authorize="hasAuthority('ADMIN')">
                        <form th:action="@{/admin/eliminaProiezione/{id}(id=${p.id})}" method="POST" class="m-0" onsubmit="return confirm('Cancellare questa proiezione?');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="btn-delete-plain">Elimina</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

        <div th:if="${#lists.isEmpty(proiezioni)}" class="empty-state-box-lg">
            Nessuna proiezione programmata nel sistema.
        </div>
    </div>

</body>
</html>
