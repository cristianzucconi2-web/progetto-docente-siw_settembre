<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festival Cinematografici - FestivalHUB</title>
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/navbar :: nav}"></div>

    <div class="container">
        <div class="page-header">
            <div>
                <h1 class="page-title">Festival Cinematografici</h1>
                <p class="page-subtitle">Esplora tutti gli eventi cinematografici registrati nella piattaforma.</p>
            </div>
            <div sec:authorize="hasAuthority('ADMIN')">
                <a th:href="@{/admin/nuovoFestival}" class="btn-primary">+ Nuovo Festival</a>
            </div>
        </div>

        <div class="grid-cards">
            <div th:each="festival : ${festivals}" class="card">
                <div class="card-header-flex">
                    <h3 th:text="${festival.nome}" class="card-title">Nome Festival</h3>
                    <span class="badge badge-gold" th:text="${festival.anno}">2026</span>
                </div>
                
                <p class="card-accent-text">
                    📍 <span th:text="${festival.citta}">Città</span>
                </p>

                <p class="card-desc-text"
                   th:text="${festival.descrizione != null ? festival.descrizione : 'Nessuna descrizione disponibile.'}">
                    Descrizione...
                </p>

                <p class="card-meta-text">
                    🗓️ <span th:text="${festival.dataInizio != null ? festival.dataInizio : 'TBD'}"></span> - 
                    <span th:text="${festival.dataFine != null ? festival.dataFine : 'TBD'}"></span>
                </p>

                <div class="card-footer-flex">
                    <a th:href="@{/festival/{id}(id=${festival.id})}" class="btn-outline btn-action-outline">Dettaglio Festival →</a>
                    
                    <span sec:authorize="hasAuthority('ADMIN')" class="flex-gap-8">
                        <a th:href="@{/admin/modificaFestival/{id}(id=${festival.id})}" class="link-edit-action">Modifica</a>
                        <form th:action="@{/admin/eliminaFestival/{id}(id=${festival.id})}" method="POST" class="form-inline" onsubmit="return confirm('Sei sicuro di voler eliminare questo festival?');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="btn-delete-plain">Elimina</button>
                        </form>
                    </span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
