<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifica Sala - FestivalHUB</title>
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/navbar :: nav}"></div>

    <div class="container">
        <div class="form-card">
            <h1 class="form-title">Modifica Sala</h1>
            
            <form th:action="@{/admin/modificaSala/{id}(id=${sala.id})}" method="POST" th:object="${sala}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" th:field="*{id}" />

                <div class="form-group">
                    <label>Nome della Sala:</label>
                    <input type="text" th:field="*{nome}" required />
                    <div class="field-error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                </div>

                <div class="form-group">
                    <label>Indirizzo / Location:</label>
                    <input type="text" th:field="*{indirizzo}" required />
                    <div class="field-error" th:if="${#fields.hasErrors('indirizzo')}" th:errors="*{indirizzo}"></div>
                </div>

                <div class="form-group">
                    <label>Capienza Spettatori:</label>
                    <input type="number" th:field="*{capienza}" min="1" required />
                    <div class="field-error" th:if="${#fields.hasErrors('capienza')}" th:errors="*{capienza}"></div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Salva Modifiche</button>
                    <a th:href="@{/sala/{id}(id=${sala.id})}" class="btn-outline">Annulla</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
