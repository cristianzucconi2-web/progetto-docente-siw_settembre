<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuovo Festival - FestivalHUB</title>
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/navbar :: nav}"></div>

    <div class="container">
        <div class="form-card">
            <h1 class="form-title">Inserisci Nuovo Festival</h1>
            
            <form th:action="@{/admin/nuovoFestival}" method="POST" th:object="${festival}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="form-group">
                    <label>Nome del Festival:</label>
                    <input type="text" th:field="*{nome}" placeholder="Es: Mostra del Cinema di Venezia" required />
                    <div class="field-error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                </div>

                <div class="form-group">
                    <label>Anno Edizione:</label>
                    <input type="number" th:field="*{anno}" placeholder="2026" required />
                    <div class="field-error" th:if="${#fields.hasErrors('anno')}" th:errors="*{anno}"></div>
                </div>

                <div class="form-group">
                    <label>Città:</label>
                    <input type="text" th:field="*{citta}" placeholder="Es: Venezia" required />
                    <div class="field-error" th:if="${#fields.hasErrors('citta')}" th:errors="*{citta}"></div>
                </div>

                <div class="grid-2-col">
                    <div class="form-group">
                        <label>Data Inizio:</label>
                        <input type="date" th:field="*{dataInizio}" />
                    </div>
                    <div class="form-group">
                        <label>Data Fine:</label>
                        <input type="date" th:field="*{dataFine}" />
                    </div>
                </div>

                <div class="form-group">
                    <label>Descrizione:</label>
                    <textarea th:field="*{descrizione}" rows="4" placeholder="Descrivi il festival, le sezioni e i premi..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Salva Festival</button>
                    <a th:href="@{/festivals}" class="btn-outline">Annulla</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
