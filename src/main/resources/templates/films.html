<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo Film - FestivalHUB</title>
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/navbar :: nav}"></div>

    <div class="container">
        <div class="page-header">
            <div>
                <h1 class="page-title">Catalogo Completo Film</h1>
                <p class="page-subtitle">Esplora tutti i film presentati ai festival o cerca per genere e regista.</p>
            </div>
            <div sec:authorize="hasAuthority('ADMIN')">
                <a th:href="@{/admin/nuovoFilm}" class="btn-primary">+ Nuovo Film</a>
            </div>
        </div>

        <div class="grid-cards">
            <div th:each="film : ${films}" class="card">
                <div class="card-header-flex-sm">
                    <h3 th:text="${film.titolo}" class="card-title">Titolo Film</h3>
                    <span class="badge badge-gold" th:text="${film.anno}">2026</span>
                </div>

                <p class="card-accent-text-sm">
                    Regia: <span th:text="${film.regista != null ? (film.regista.nome + ' ' + film.regista.cognome) : 'N/D'}"></span>
                </p>

                <p class="card-desc-clamp"
                   th:text="${film.trama != null ? film.trama : 'Nessuna trama inserita.'}">
                    Trama...
                </p>

                <div class="mb-15">
                    <span class="badge mr-5" th:text="${film.genere}">Genere</span>
                    <span class="badge badge-gray" th:text="${film.durata} + ' min'">Durata</span>
                </div>

                <!-- Festival a cui partecipa -->
                <div class="mb-20">
                    <small class="label-subtle">Festival:</small>
                    <span th:each="fest : ${film.festival}" class="badge badge-gold badge-sm" th:text="${fest.citta}"></span>
                    <span th:if="${#lists.isEmpty(film.festival)}" class="badge-empty-text">Nessun festival associato</span>
                </div>

                <div class="card-footer-flex">
                    <a th:href="@{/film/{id}(id=${film.id})}" class="btn-outline btn-action-outline">Dettagli & Recensioni →</a>
                    
                    <span sec:authorize="hasAuthority('ADMIN')" class="flex-gap-8">
                        <a th:href="@{/admin/modificaFilm/{id}(id=${film.id})}" class="link-edit-action">Modifica</a>
                        <form th:action="@{/admin/eliminaFilm/{id}(id=${film.id})}" method="POST" class="form-inline" onsubmit="return confirm('Eliminando il film verranno eliminate anche le proiezioni e recensioni collegate. Sei sicuro?');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="btn-delete-plain">Elimina</button>
                        </form>
                    </span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
