<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <nav th:fragment="nav" class="navbar">
        <a th:href="@{/}" class="logo">
            <span>🎬</span> FestivalHUB
        </a>
        <ul class="nav-links">
            <li><a th:href="@{/}">Home</a></li>
            <li><a th:href="@{/festivals}">Festival</a></li>
            <li><a th:href="@{/films}">Film</a></li>
            <li><a th:href="@{/registi}">Registi</a></li>
            <li><a th:href="@{/sale}">Sale</a></li>
            <li><a th:href="@{/proiezioni}">Programma Proiezioni</a></li>
            <li><a th:href="@{/cerca}">Ricerca Live</a></li>
        </ul>
        
        <div class="nav-auth">
            <div sec:authorize="isAnonymous()">
                <a th:href="@{/login}" class="btn-outline">Accedi</a>
                <a th:href="@{/register}" class="btn-primary">Registrati</a>
            </div>
            <div sec:authorize="isAuthenticated()" class="nav-auth-user">
                <a sec:authorize="hasAuthority('ADMIN')" th:href="@{/admin}" class="btn-outline btn-admin-nav">
                    ⚡ Pannello Admin
                </a>
                <span class="nav-greeting">
                    Ciao, <strong sec:authentication="name" class="nav-username"></strong>!
                </span>
                <form th:action="@{/logout}" method="post" class="form-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn-logout">Logout</button>
                </form>
            </div>
        </div>
    </nav>
</body>
</html>
