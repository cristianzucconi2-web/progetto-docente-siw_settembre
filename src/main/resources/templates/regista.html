<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${regista.nome + ' ' + regista.cognome} + ' - FestivalHUB'">Scheda Regista</title>
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/navbar :: nav}"></div>

    <div class="container">
        <!-- Scheda Profilo Regista -->
        <div class="detail-hero-card">
            <div class="flex-between-start flex-wrap flex-gap-15">
                <div>
                    <h1 class="detail-title" th:text="${regista.nome + ' ' + regista.cognome}">Nome Cognome</h1>
                    <p class="detail-accent-text">
                        🌍 Nazionalità: <span th:text="${regista.nazionalita != null ? regista.nazionalita : 'Non specificata'}"></span>
                    </p>
                    <p class="detail-meta-text" th:if="${regista.dataNascita != null}">
                        🎂 Data di nascita: <span th:text="${regista.dataNascita}"></span>
                    </p>
                </div>

                <div sec:authorize="hasAuthority('ADMIN')" class="flex-gap-10 align-center">
                    <a th:href="@{/admin/modificaRegista/{id}(id=${regista.id})}" class="btn-outline btn-action-outline">Modifica Regista</a>
                    <form th:action="@{/admin/eliminaRegista/{id}(id=${regista.id})}" method="POST" class="form-inline" onsubmit="return confirm('Eliminare questo regista?');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn-logout">Elimina Regista</button>
                    </form>
                </div>
            </div>

            <div class="detail-section-divider-sm">
                <h3 class="section-title-sm">Biografia</h3>
                <p class="detail-body-text-plain" th:text="${regista.biografia != null ? regista.biografia : 'Nessuna biografia disponibile.'}">
                    Biografia...
                </p>
            </div>
        </div>

        <!-- Sezione Filmografia -->
        <div>
            <h2 class="section-title">🎬 Film Diretti</h2>

            <div th:if="${not #lists.isEmpty(regista.film)}" class="grid-cards">
                <div th:each="f : ${regista.film}" class="card">
                    <h3 th:text="${f.titolo}" class="mt-0">Titolo Film</h3>
                    <p class="card-meta-text-sm">
                        Anno: <strong th:text="${f.anno}"></strong> • Genere: <strong th:text="${f.genere}"></strong>
                    </p>
                    <a th:href="@{/film/{id}(id=${f.id})}" class="btn-outline btn-action-outline-sm">Scheda Film →</a>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(regista.film)}" class="empty-state-box">
                Nessun film registrato per questo regista.
            </div>
        </div>

        <div class="mt-40">
            <a th:href="@{/registi}" class="btn-outline">← Torna all'elenco registi</a>
        </div>
    </div>

</body>
</html>
