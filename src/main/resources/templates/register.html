<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrati - FestivalHUB</title>
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/navbar :: nav}"></div>

    <div class="container-register">
        <div class="form-card">
            <div class="text-center mb-25">
                <h1 class="card-title">Crea il tuo Account</h1>
                <p class="card-desc-text mt-5 mb-0">Registrati per lasciare recensioni ai film dei festival</p>
            </div>

            <form th:action="@{/register}" method="POST">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="form-group">
                    <label>Nome:</label>
                    <input type="text" th:field="${user.name}" placeholder="Mario" required />
                    <div class="field-error" th:if="${#fields.hasErrors('user.name')}" th:errors="${user.name}"></div>
                </div>

                <div class="form-group">
                    <label>Cognome:</label>
                    <input type="text" th:field="${user.surname}" placeholder="Rossi" required />
                    <div class="field-error" th:if="${#fields.hasErrors('user.surname')}" th:errors="${user.surname}"></div>
                </div>

                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" th:field="${user.email}" placeholder="mario.rossi@email.com" required />
                    <div class="field-error" th:if="${#fields.hasErrors('user.email')}" th:errors="${user.email}"></div>
                </div>

                <div class="form-group">
                    <label>Username:</label>
                    <input type="text" th:field="${credentials.username}" placeholder="mario_rossi" required />
                    <div class="field-error" th:if="${#fields.hasErrors('credentials.username')}" th:errors="${credentials.username}"></div>
                </div>

                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" th:field="${credentials.password}" placeholder="Minimo 5 caratteri" required />
                    <div class="field-error" th:if="${#fields.hasErrors('credentials.password')}" th:errors="${credentials.password}"></div>
                </div>

                <button type="submit" class="btn-primary btn-full-width">Completa Registrazione</button>
            </form>

            <div class="form-footer">
                Hai già un account? <a th:href="@{/login}">Accedi qui</a>
            </div>
        </div>
    </div>

</body>
</html>
